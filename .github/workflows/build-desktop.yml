name: Build desktop packages

# 三平台绿色包：macOS（zip，x64/arm64）· Linux（AppImage）· Windows（portable exe）
# 手动触发产出 artifact；打 tag 触发则同时发布到 Release。

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: --x64
            artifact: linux-x64
          - os: macos-15
            platform: mac
            arch: --x64 --arm64
            artifact: mac
          - os: windows-latest
            platform: win
            arch: --x64
            artifact: win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. 构建 VIA 前端（含键盘定义、离线化补丁）
      - name: Install app dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build keyboard definitions and web bundle
        working-directory: app
        run: |
          node --import tsx node_modules/via-keyboards/scripts/build-all.ts public/definitions
          npx tsc
          npx vite build
          node postbuild-offline.js

      # 2. 组装 electron 应用目录
      - name: Assemble app directory
        shell: bash
        run: |
          mkdir -p build/app
          cp -r app/dist build/app/dist
          cp app/electron/main.js build/app/main.js
          cp app/server.js build/app/server.js
          cp packaging/icon.png build/app/icon.png
          cp packaging/app-package.json build/app/package.json
          cp NOTICE.md build/app/NOTICE.txt
          cp LICENSE build/app/LICENSE

      # 3. 打包
      - name: Package (${{ matrix.platform }} ${{ matrix.arch }})
        working-directory: build/app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: >-
          npx --yes electron-builder@25.1.8
          --config ../../packaging/builder.yml
          --${{ matrix.platform }} ${{ matrix.arch }}
          --publish never

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-out
          find build/app/out -maxdepth 1 -type f \
            \( -name "*.zip" -o -name "*.AppImage" -o -name "*.exe" \) \
            -exec cp {} dist-out/ \;
          ls -lh dist-out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-out/*
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "$GITHUB_REPOSITORY" --title "K-STAR ${GITHUB_REF_NAME}" --generate-notes --verify-tag || gh release upload "${GITHUB_REF_NAME}" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
