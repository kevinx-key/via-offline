name: Attach macOS dmg to a release

# 用一个已存在的构建产物的 artifact，把 .dmg 补挂到指定 Release。
# 全程在 runner 上完成，不需要本地下载几百 MB。
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "构建 run 的 id（含 mac artifact 的那次）"
        required: true
      tag:
        description: "目标 Release tag，例如 v1.0.3"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Download mac artifact from the build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p mac
          gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n mac -D mac
          find mac -type f -printf '%f  %s bytes\n'

      - name: Upload dmg files to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(find mac -type f -name '*.dmg')
          if [ -z "$files" ]; then
            echo "no .dmg found in artifact"; exit 1
          fi
          gh release upload "${{ inputs.tag }}" $files -R "$GITHUB_REPOSITORY" --clobber
          gh release view "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name)  \(.size/1048576|floor) MB"'
