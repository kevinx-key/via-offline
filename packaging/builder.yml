appId: studio.kstar.via.offline
productName: VIA-Offline-KS
copyright: GPL-3.0 · K Star Studio

electronVersion: 33.4.11

# Chromium ships 55 UI locales (~40 MB unpacked). The app has its own i18n in
# app/src/locales, so only these three are needed; dropping the rest keeps the
# download and the extraction smaller.
electronLanguages:
  - zh-CN
  - zh-TW
  - en-US

directories:
  output: out
  buildResources: .

files:
  - main.js
  - server.js
  - preload.js
  - global-capture.js
  - hid-picker.html
  - hid-picker-preload.js
  - keyhook.bin
  - icon.png
  - NOTICE.txt
  - LICENSE
  - dist/**/*

asar: true
compression: normal

win:
  # No portable target any more: `launcher/` (via-pack) turns this unpacked
  # directory into the single-file exe. A plain `dir` build is all we need.
  target:
    - target: dir
      arch: [x64]
  icon: icon.ico

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: icon.png
  category: public.app-category.utilities
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: icon.png
  category: Utility
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
